# ============================================================
# OpenClaw Android APK 云编译工作流（Debug 版）
# ------------------------------------------------------------
# 用途：在 GitHub Actions 云端编译 OpenClaw 安卓 App，
#       产出 Debug APK 供直接安装使用。
# 说明：Debug 版不需要官方签名密钥，功能完整（聊天/语音/
#       网关连接/设备控制）。安装后应用名带 "debug" 标识。
# ============================================================
name: Build OpenClaw Android APK (Debug)

on:
  workflow_dispatch:        # 手动触发：仓库 Actions 页面点 "Run workflow"
  push:
    tags:
      - 'v*'               # 打 tag 时自动触发（可选）

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle*
            apps/android/**/gradle-wrapper.properties
            apps/android/gradle/libs.versions.toml

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build Debug APK
        shell: bash
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon :app:assemblePlayDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Android-debug-apk
          path: |
            apps/android/app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
          retention-days: 30
